<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Футболни прогнози</title>
<style>
:root { --bg: #f6f5f1; --ink: #1d1d1b; --muted: #6b6a64; }
@media (prefers-color-scheme: dark) { :root { --bg: #151514; --ink: #ecebe6; --muted: #9a998f; } }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, sans-serif;
       display: grid; place-items: center; min-height: 100vh; padding: 0 16px; }
p { color: var(--muted); max-width: 32em; }
</style>
</head>
<body>
<main>
<h1>Сайтът се строи наново</h1>
<p>Изцяло по идеите на професионалиста: прогнози за всички мачове от всички първенства, процент на познатите по лиги, голове, шампиони и изпадащи.</p>
</main>
</body>
</html>
