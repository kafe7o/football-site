# Роботът на всеки час НА СЪРВЪРИТЕ НА GITHUB - лаптопът не е нужен (2026-09-29).
#
# Цикълът (pipeline/run.py cloud): резултати -> предстоящите мачове от всички първенства ->
# цени -> запис на днешните прогнози -> уреждане -> сайт -> известия (сутрин, вечер, седмица).
#
# Защо не само cron: графикът на GitHub е "по възможност" (на 2026-09-25 пропусна 5 поредни
# пускания). Затова всяко пускане САМО си поръчва следващото (задачата "next": чака ~50 минути
# и пуска workflow_dispatch). Графикът остава като резерва: ако веригата се скъса, първото
# пускане по график я връща.
name: robot

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: robot
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Целият цикъл
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GH_TOKEN: ${{ github.token }}          # за поръчване на бонус анализите (bonus.yml)
          FOOTBALL_DB: ${{ github.workspace }}/robot.db
          FOOTBALL_SITE: ${{ github.workspace }}
          FOOTBALL_LOGS: ${{ runner.temp }}/logs
          FOOTBALL_CACHE: ${{ runner.temp }}/cache
          PYTHONIOENCODING: utf-8
        run: cd pipeline && python run.py cloud

      - name: Записване на промените
        if: always()
        run: |
          git config user.name "football-bot"
          git config user.email "football-bot@users.noreply.github.com"
          git add index.html robot.db
          git diff --staged --quiet || git commit -m "Роботът: обновено"
          git pull --rebase -q origin main || true
          git push

  next:
    # Поръчва следващото пускане - и когато това е паднало, за да не спре веригата. Докато чака (~50 мин.),
    # наблюдава мачовете, които свършват (bets/live.py): резултатът до минути след края, в results/.
    needs: update
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main                     # последното от update - базата с днешните записи

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Наблюдател на резултатите (до следващото пускане)
        continue-on-error: true         # каквото и да стане тук, веригата продължава
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FOOTBALL_DB: ${{ github.workspace }}/robot.db
          FOOTBALL_SITE: ${{ github.workspace }}
          FOOTBALL_LOGS: ${{ runner.temp }}/logs
          FOOTBALL_CACHE: ${{ runner.temp }}/cache
          PYTHONIOENCODING: utf-8
          WAIT_SECONDS: ${{ vars.CHAIN_WAIT_SECONDS || '3000' }}
        run: |
          git config user.name "football-bot"
          git config user.email "football-bot@users.noreply.github.com"
          cd pipeline && timeout $((WAIT_SECONDS + 300)) python run.py watch --seconds $((WAIT_SECONDS - 120))

      - name: Следващо пускане
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          waiting=$(gh run list -R "${{ github.repository }}" -w robot.yml -L 20 \
                    --json status,databaseId -q "[.[] | select(.status==\"queued\" or .status==\"pending\" or .status==\"waiting\") | select(.databaseId != ${{ github.run_id }})] | length")
          if [ "${waiting:-0}" -eq 0 ]; then
            gh workflow run robot.yml -R "${{ github.repository }}" --ref main
            echo "следващото пускане е поръчано"
          else
            echo "вече чака пускане - не поръчвам второ"
          fi
