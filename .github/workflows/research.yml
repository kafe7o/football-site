# Проверка назад ПО ЗАЯВКА на сървърите на GitHub (24.10): пуска един скрипт от pipeline/research върху архива (всички лиги от 2012,
# шифрован в изданието „archive“) и записва резултата в хранилището: data/<име>.json и research/out/<име>.txt (изходът на скрипта,
# и при грешка). Роботът не се пипа. Пускане: Actions -> research -> Run workflow -> името на скрипта без .py (напр. bank_history_backtest).
name: research

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Скриптът от pipeline/research без .py (пише data/<име>.json)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Архивът и скриптът
        env:
          SCRIPT: ${{ inputs.script }}
          ARCHIVE_KEY: ${{ secrets.ARCHIVE_KEY }}
          GH_TOKEN: ${{ github.token }}
          FOOTBALL_DB: ${{ github.workspace }}/pipeline/football.db   # някои проверки (pro_price_backtest) отварят pipeline/football.db направо
          FOOTBALL_LOGS: ${{ runner.temp }}/logs
          FOOTBALL_CACHE: ${{ runner.temp }}/cache
          PYTHONIOENCODING: utf-8
        run: |
          case "$SCRIPT" in *[!a-z0-9_]*|"") echo "лошо име на скрипт"; exit 1;; esac
          test -f "pipeline/research/$SCRIPT.py" || { echo "няма pipeline/research/$SCRIPT.py"; exit 1; }
          cd pipeline
          python -c "from bets import archive, config; archive.pull_db(config.DB_PATH)"
          mkdir -p research/out
          python -m "research.$SCRIPT" 2>&1 | tee "research/out/$SCRIPT.txt"
          test "${PIPESTATUS[0]}" -eq 0

      - name: Записване на резултата
        if: always()
        env:
          SCRIPT: ${{ inputs.script }}
        run: |
          git config user.name "football-bot"
          git config user.email "football-bot@users.noreply.github.com"
          git add -f "pipeline/research/out/$SCRIPT.txt"
          test -f "pipeline/data/$SCRIPT.json" && git add "pipeline/data/$SCRIPT.json"
          git diff --staged --quiet && exit 0
          git commit -m "Проверка назад: $SCRIPT"
          for i in 1 2 3; do
            git pull --rebase -q origin main && git push && exit 0
            sleep 20
          done
          exit 1
