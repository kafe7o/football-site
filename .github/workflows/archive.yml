# Седмичният анализ НА СЪРВЪРИТЕ НА GITHUB - лаптопът не е нужен (2026-09-30).
#
# pipeline/run.py weekly: архивът (всички лиги от 2012) се сваля шифрован от изданието „archive“,
# допълва се с новите мачове и xG, анализът по първенства се смята наново, а първия понеделник
# от месеца и роботът назад. После архивът се качва обратно, анализите влизат в pipeline/data и
# сайтът ги показва при следващото часово пускане. Известие по ntfy след всяко пускане.
#
# Правилата на робота НЕ се пипат - само числата (bets/robot.py заключва тото лигите).
name: archive

on:
  schedule:
    - cron: "0 1 * * 1"      # понеделник 04:00 българско лятно време (03:00 зимно)
  workflow_dispatch:
    inputs:
      backtest:
        description: "И роботът назад (иначе само първия понеделник от месеца)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: archive
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Седмичният анализ
        env:
          ARCHIVE_KEY: ${{ secrets.ARCHIVE_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GH_TOKEN: ${{ github.token }}
          FOOTBALL_DB: ${{ runner.temp }}/football.db
          FOOTBALL_LOGS: ${{ runner.temp }}/logs
          FOOTBALL_CACHE: ${{ runner.temp }}/cache
          PYTHONIOENCODING: utf-8
        run: cd pipeline && python run.py weekly ${{ inputs.backtest && '--backtest' || '' }}

      - name: Записване на анализите
        if: always()
        run: |
          git config user.name "football-bot"
          git config user.email "football-bot@users.noreply.github.com"
          git add pipeline/data/leagues.json pipeline/data/backtest.json pipeline/data/extras_backtest.json pipeline/data/signs_backtest.json pipeline/data/one_backtest.json
          git diff --staged --quiet && exit 0
          git commit -m "Архивът: седмичен анализ"
          for i in 1 2 3; do
            git pull --rebase -q origin main && git push && exit 0
            sleep 20
          done
          exit 1

      - name: Известие при срив
        # само ако седмичният анализ не е успял да прати своето известие (падна преди него)
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          test -f "$RUNNER_TEMP/weekly_notified" && exit 0
          python -c "
          import json, os, urllib.request
          body = json.dumps({'topic': os.environ['NTFY_TOPIC'], 'title': 'Седмичният анализ падна',
                             'message': 'Пускането спря преди края. Нищо в робота не е сменено. Виж: ' + os.environ['RUN_URL'],
                             'tags': ['warning'], 'priority': 4, 'click': os.environ['RUN_URL']}, ensure_ascii=False).encode()
          urllib.request.urlopen(urllib.request.Request('https://ntfy.sh', data=body, headers={'Content-Type': 'application/json'}), timeout=20)
          "
