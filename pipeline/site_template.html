<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Прогнози за всички мачове от всички първенства, по идеите на професионалиста - и колко от тях излизат">
<title>Футболният робот</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root {
  color-scheme: light;
  --bg: #eef1f4; --panel: #ffffff; --ink: #0f1419; --muted: #626d7a; --line: #dbe1e8;
  --rail: #c3ccd6; --chip: #e4e9ef; --accent: #12263f; --accent-ink: #ffffff;
  --home: #2b5fb8; --draw: #7d8794; --away: #c25a21;
  --ok: #17663c; --ok-bg: rgba(23,102,60,.12);
  --bad: #a52218; --bad-bg: rgba(165,34,24,.10);
  --sig: #7a4c00; --sig-bg: rgba(122,76,0,.12);
  --shadow: 0 1px 2px rgba(15,20,25,.06), 0 8px 24px rgba(15,20,25,.05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0e1217; --panel: #161b22; --ink: #e7ecf2; --muted: #8e9aa8; --line: #232b35;
    --rail: #39434f; --chip: #1f262f; --accent: #d7e5f5; --accent-ink: #0e1217;
    --home: #7aa6ee; --draw: #8e98a5; --away: #ef9560;
    --ok: #5fc98c; --ok-bg: rgba(95,201,140,.14);
    --bad: #f0796f; --bad-bg: rgba(240,121,111,.13);
    --sig: #e0b25f; --sig-bg: rgba(224,178,95,.14);
    --shadow: 0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0e1217; --panel: #161b22; --ink: #e7ecf2; --muted: #8e9aa8; --line: #232b35;
  --rail: #39434f; --chip: #1f262f; --accent: #d7e5f5; --accent-ink: #0e1217;
  --home: #7aa6ee; --draw: #8e98a5; --away: #ef9560;
  --ok: #5fc98c; --ok-bg: rgba(95,201,140,.14);
  --bad: #f0796f; --bad-bg: rgba(240,121,111,.13);
  --sig: #e0b25f; --sig-bg: rgba(224,178,95,.14);
  --shadow: 0 1px 2px rgba(0,0,0,.4);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); margin: 0;
       font: 15px/1.55 "IBM Plex Sans", -apple-system, "Segoe UI", Roboto, sans-serif; }
.wrap { max-width: 960px; margin: 0 auto; padding: 20px 16px 72px; }
h1 { font: 600 27px/1.2 Bitter, Georgia, serif; margin: 0; letter-spacing: -.01em; }
h2 { font: 600 18px/1.3 Bitter, Georgia, serif; margin: 22px 0 8px; }
h3 { font: 600 15px/1.3 "IBM Plex Sans", sans-serif; margin: 0 0 6px; }
.lede { color: var(--muted); font-size: 14px; margin: 6px 0 4px; max-width: 66ch; }
.status { color: var(--muted); font-size: 12.5px; margin: 0; }
.num { font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
button { font: inherit; color: inherit; }

.tabs { display: flex; gap: 2px; margin: 16px 0 14px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted);
  font: 600 14px/1 "IBM Plex Sans", sans-serif; padding: 11px 14px; cursor: pointer; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tabs button:focus-visible { outline: 2px solid var(--home); outline-offset: -2px; }
[role="tabpanel"][hidden] { display: none; }

.chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 10px; }
.chips button { border: 1px solid var(--line); background: var(--panel); border-radius: 16px; padding: 5px 12px;
  font-size: 13px; cursor: pointer; white-space: nowrap; }
.chips button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chips button .c { opacity: .7; margin-left: 4px; font-size: 11.5px; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 0 0 12px; }
.controls input[type=search], .controls select { border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  border-radius: 8px; padding: 7px 10px; font: 14px "IBM Plex Sans", sans-serif; min-width: 0; }
.controls input[type=search] { flex: 1 1 180px; }
.controls label { font-size: 13px; display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
.note { background: var(--chip); border-radius: 8px; padding: 10px 12px; font-size: 13px; margin: 0 0 12px; }
.note.warn { background: var(--sig-bg); }
.note b { font-weight: 600; }

.lg { margin: 16px 0 6px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.lg h3 { margin: 0; font-size: 14.5px; }
.badge { font-size: 11px; font-weight: 600; border-radius: 5px; padding: 2px 7px; white-space: nowrap;
  background: var(--chip); color: var(--muted); }
.badge.warn { background: var(--sig-bg); color: var(--sig); }
.badge.ok { background: var(--ok-bg); color: var(--ok); }
.badge.bad { background: var(--bad-bg); color: var(--bad); }

.m { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px; margin-bottom: 7px; }
.m .top { display: grid; grid-template-columns: 46px 1fr auto; gap: 8px; align-items: baseline; }
.m .time { font-family: "IBM Plex Mono", monospace; font-size: 13px; color: var(--muted); }
.m .teams { font-weight: 500; font-size: 15px; min-width: 0; overflow-wrap: anywhere; }
.m .flags { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.bar { display: flex; height: 22px; border-radius: 5px; overflow: hidden; margin: 8px 0 3px; font-size: 11.5px;
  font-family: "IBM Plex Mono", monospace; color: #fff; }
.bar span { display: flex; align-items: center; justify-content: center; min-width: 26px; white-space: nowrap; }
.bar .h { background: var(--home); } .bar .d { background: var(--draw); } .bar .a { background: var(--away); }
:root[data-theme="dark"] .bar span, .dark-bar span { color: #0e1217; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .bar span { color: #0e1217; } }
.sub { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 12px; }
.picks { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.pk { background: var(--chip); border-radius: 6px; padding: 4px 8px; font-size: 12.5px; }
.pk b { font-weight: 600; }
.pk .num { font-size: 12px; }
.tip { margin-top: 8px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; padding: 8px 10px;
  border-radius: 8px; background: var(--ok-bg); font-size: 13.5px; }
.tip b { font-weight: 700; }
.tip.none { background: var(--chip); color: var(--muted); }
.tip .meta { font-size: 12px; color: var(--muted); }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin: 0 0 14px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.tile .k { font-size: 12px; color: var(--muted); }
.tile .v { font: 600 22px/1.2 "IBM Plex Mono", monospace; margin: 3px 0; }
.tile .s { font-size: 12px; color: var(--muted); }
.pos { color: var(--ok); } .neg { color: var(--bad); }

.tbl-wrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 12px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 7px 9px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 11.5px; color: var(--muted); font-weight: 600; background: var(--panel); position: sticky; top: 0; }
th[data-sort] { cursor: pointer; }
th[data-sort]:hover { color: var(--ink); }
td:first-child, th:first-child { text-align: left; }
td.l { text-align: left; white-space: normal; min-width: 150px; }
table.standings td.l { min-width: 110px; }
table.standings th:nth-child(2) { text-align: left; }
table.standings th, table.standings td { padding: 6px 7px; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--chip); }
tr.sel td { background: var(--chip); }
tbody tr:last-child td { border-bottom: 0; }
td .num, td.num { font-family: "IBM Plex Mono", monospace; }

.res { display: grid; grid-template-columns: 44px 1fr auto; gap: 4px 8px; padding: 8px 12px; border-bottom: 1px solid var(--line);
  font-size: 13.5px; align-items: baseline; }
.res:last-child { border-bottom: 0; }
/* мач по мач с падащо меню */
.rs2 { padding: 9px 12px; border-bottom: 1px solid var(--line); }
.rs2:last-child { border-bottom: 0; }
.rs2 .top { display: grid; grid-template-columns: 44px 1fr auto auto auto; gap: 4px 8px; align-items: baseline; font-size: 13.5px; }
.rs2 .sc { font-family: "IBM Plex Mono", monospace; font-weight: 600; }
.big { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 6px; font-weight: 700; font-size: 14px; }
.big.y { background: var(--ok-bg); } .big.n { background: var(--bad-bg); } .big.w { background: var(--chip); color: var(--muted); font-size: 12px; }
.rs2 .lost { margin: 6px 0 0 54px; display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; }
.rs2 details.an { margin: 6px 0 0 54px; }
.dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 12.5px; margin-top: 6px; }
.dl dt { color: var(--muted); } .dl dd { margin: 0; }
@media (max-width: 560px) { .rs2 .lost, .rs2 details.an { margin-left: 0; } }
.dl .alt { color: var(--muted); } .dl .won { font-weight: 700; text-decoration: underline; }
/* „Чакат резултат“ - свито, броят и стрелката вдясно */
details.pend { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin: 0 0 12px; }
details.pend > summary { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 11px 13px; cursor: pointer; list-style: none; font-size: 14px; }
details.pend > summary::-webkit-details-marker { display: none; }
details.pend > summary .arr { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 7px; background: var(--chip); font-size: 15px; transition: transform .15s; }
details.pend[open] > summary .arr { transform: rotate(180deg); }
details.pend > .inner { padding: 0 10px 10px; }
.res .sc { font-family: "IBM Plex Mono", monospace; font-weight: 600; }
.res .rp { grid-column: 2 / 4; display: flex; gap: 6px; flex-wrap: wrap; font-size: 12px; }
.y { color: var(--ok); font-weight: 600; } .n { color: var(--bad); font-weight: 600; }
.day-h { font: 600 13px/1 "IBM Plex Sans", sans-serif; color: var(--muted); margin: 14px 0 6px; text-transform: uppercase; letter-spacing: .04em; }

.hbar { display: grid; grid-template-columns: minmax(120px, 210px) 1fr 44px; gap: 8px; align-items: center; font-size: 12.5px; margin: 3px 0; }
.hbar .track { background: var(--chip); border-radius: 4px; height: 14px; overflow: hidden; }
.hbar .fill { background: var(--home); height: 100%; }
.hbar .fill.hl { background: var(--away); }
.hbar .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* рискова и по-сигурна прогноза */
.preds { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.pred { border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; }
.pred.risky { background: var(--sig-bg); }
.pred.safe { background: var(--ok-bg); }
.pred .pl { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
.pred .pv { font: 700 18px/1.2 "IBM Plex Sans", sans-serif; }
.pred .pm { font-size: 12px; color: var(--muted); }
.pred-note { font-size: 11.5px; color: var(--muted); margin-top: 4px; }
/* едната прогноза на робота - главната */
.one { margin-top: 8px; border: 2px solid var(--home); border-radius: 10px; padding: 9px 12px; display: flex; flex-direction: column; gap: 2px; }
.one .ol { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--home); font-weight: 700; }
.one .ov { font: 700 20px/1.2 "IBM Plex Sans", sans-serif; }
.one .om { font-size: 12px; color: var(--muted); }
.others { margin-top: 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
.onebox { margin: 6px 0 0 54px; border: 1.5px solid var(--home); border-radius: 8px; padding: 5px 10px; font-size: 13px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; }
.onebox .ol { font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--home); font-weight: 700; }
@media (max-width: 560px) { .onebox { margin-left: 0; } }
.chip1 { font-size: 11.5px; padding: 2px 6px; border-radius: 5px; background: var(--chip); white-space: nowrap; }
.bonus { margin-top: 8px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; }
.bonus.changed { border-color: var(--sig); background: var(--sig-bg); }
.bonus b.t { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 3px; }
.bonus ul { margin: 2px 0 0; padding-left: 18px; }
@media (max-width: 420px) { .preds { grid-template-columns: 1fr; } }
/* анализът на мача */
details.an { margin-top: 8px; border-top: 1px dashed var(--line); padding-top: 6px; }
details.an summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--home); list-style: none; }
details.an summary::-webkit-details-marker { display: none; }
details.an summary::before { content: "▸ "; }
details.an[open] summary::before { content: "▾ "; }
.an-text { margin: 6px 0 0; padding-left: 16px; font-size: 13px; }
.an-text li { margin: 3px 0; }
.an-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.an-box { background: var(--chip); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; min-width: 0; }
.an-box b.h { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 4px; }
.fc { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 4px; font-size: 11px; font-weight: 700; color: #fff; margin: 1px; }
.fc.W { background: var(--ok); } .fc.D { background: var(--draw); } .fc.L { background: var(--bad); }
.an-row { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 8px; padding: 2px 0; }
.an-row span:last-child { font-family: "IBM Plex Mono", monospace; margin-left: auto; text-align: right; }
.an-grid > * { min-width: 0; }
.round ul { margin: 6px 0 0; padding-left: 18px; font-size: 13.5px; }
.round li { margin: 4px 0; }
@media (max-width: 560px) { .an-grid { grid-template-columns: 1fr; } }
.pro-tip { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 10px; }
.pro-date { font-size: 12px; color: var(--muted); }
.pro-h { font: 600 16px/1.3 "IBM Plex Sans", sans-serif; margin: 4px 0 6px; }
.pro-said { font-size: 14px; margin: 0 0 6px; }
.pro-check { font-size: 13px; color: var(--muted); margin: 0 0 6px; }
.pro-status { font-size: 13px; color: var(--sig); font-weight: 600; margin: 0; }
.more { display: block; width: 100%; margin: 8px 0; padding: 9px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--panel); cursor: pointer; font-size: 13.5px; }
.more[hidden] { display: none; }
.empty { padding: 24px 14px; text-align: center; color: var(--muted); }
footer { margin-top: 30px; font-size: 12px; color: var(--muted); }
.theme { float: right; border: 1px solid var(--line); background: var(--panel); border-radius: 16px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
@media (max-width: 560px) {
  h1 { font-size: 22px; }
  .tabs button { padding: 11px 9px; font-size: 13.5px; }
  .m .top { grid-template-columns: 42px 1fr; }
  .m .flags { grid-column: 1 / 3; justify-content: flex-start; }
  .tile .v { font-size: 19px; }
  .hbar { grid-template-columns: 110px 1fr 38px; }
}
</style>
</head>
<body>
<div class="wrap">
  <button class="theme" id="theme" type="button">тема</button>
  <h1>Футболният робот</h1>
  <p class="lede">Прогноза за всеки мач от всяко първенство - 1/X/2, двоен шанс, над/под 2.5 - и точен запис кои
    излизат, по лиги. Изцяло по идеите на професионалиста. Записът е преди мача и не се променя.</p>
  <p class="status" id="status"></p>

  <div class="tabs" role="tablist">
    <button role="tab" id="t-fc" aria-controls="p-fc" aria-selected="true">Прогнози</button>
    <button role="tab" id="t-rs" aria-controls="p-rs" aria-selected="false">Резултати</button>
    <button role="tab" id="t-lg" aria-controls="p-lg" aria-selected="false">Лиги</button>
    <button role="tab" id="t-pr" aria-controls="p-pr" aria-selected="false">Професионалист</button>
  </div>

  <section role="tabpanel" id="p-fc" aria-labelledby="t-fc">
    <div class="chips scroll" id="fc-days"></div>
    <div class="controls">
      <input type="search" id="fc-q" placeholder="Отбор или първенство" aria-label="Търсене">
      <select id="fc-league" aria-label="Първенство"></select>
      <select id="fc-sort" aria-label="Подредба">
        <option value="time">По час</option>
        <option value="sure">Най-сигурните прогнози първо</option>
      </select>
      <label><input type="checkbox" id="fc-tip"> само с прогноза на робота</label>
    </div>
    <div id="fc-note"></div>
    <div id="fc-list"></div>
  </section>

  <section role="tabpanel" id="p-rs" aria-labelledby="t-rs" hidden>
    <div class="chips" id="rs-period"></div>
    <div class="chips" id="rs-filter"></div>
    <div id="rs-body"></div>
  </section>

  <section role="tabpanel" id="p-lg" aria-labelledby="t-lg" hidden>
    <div id="lg-body"></div>
  </section>

  <section role="tabpanel" id="p-pr" aria-labelledby="t-pr" hidden>
    <div id="pr-body"></div>
  </section>

  <footer id="foot"></footer>
</div>

<script>
const DATA = /*__DATA__*/null;
const L = DATA.leagues;
const AN = (DATA.analysis || {}).leagues || {};
const BT = (DATA.backtest || {}).leagues || {};
const RULE = (DATA.backtest || {}).rule || "likely";
const STAKE = 10;
// Професионалистът (2026-09-30): „топ 10“ първенства за анализите на кръга. България - когато има данни.
const TOP10 = ["E0", "SP1", "I1", "D1", "F1", "BUL", "T1", "N1", "P1", "B1"];
const XBT = DATA.extras_bt || {};
const SB = DATA.signs_bt || {};
// едната прогноза назад (research/one_pick_backtest.py): колко често излизат такива прогнози
const ONEBT = DATA.one_bt || null;
// границите на професионалиста (bets/robot.py): по-сигурна и едната прогноза, рискова
const RG = DATA.ranges || {safe: [1.4, null], floor: 1.4, risky: "under50"};
const rangeTxt = r => r[1] ? `${r[0].toFixed(2)}-${r[1].toFixed(2)}` : `от ${r[0].toFixed(2)}`;
const SAFE_TXT = rangeTxt(RG.safe), ONE_TXT = rangeTxt(RG.one || [RG.floor || 1.4, null]);
const RISKY_TXT = RG.risky === "under50" ? "знак 1 или 2 под 50%" : `от ${(RG.risky_from || 2.5).toFixed(2)}`;
const oneBack = () => ONEBT && ONEBT.clean ? `назад такива прогнози излизат ${pct(ONEBT.clean.hit)} (чиста проверка, ${ONEBT.clean.n} мача; роботът казваше средно ${pct(ONEBT.clean.said)})` : "";
// Бонус анализ час преди мачовете от топ 5 (bets/bonus.py): вграден при часовото обновяване, а за
// мачовете в следващите часове страницата дотегля bonus/<час>.json веднага след като е готов.
const BONUS = Object.assign({}, DATA.bonus || {});
const TOP5 = ["E0", "SP1", "I1", "D1", "F1"];
const slotName = iso => new Date(iso).toISOString().slice(0, 16).replace(":", "");
// етикетите на всички избори - и линиите на головете, картоните и корнерите (като bets/robot.py: label)
const LAB2 = {O15: "над 1.5", U15: "под 1.5", O35: "над 3.5", U35: "под 3.5", GG: "двата вкарват", NG: "не вкарват и двата",
  H1: "1 с хендикап 0:1 (домакинът с 2+ гола)", H2: "2 с хендикап 1:0 (гостът с 2+ гола)",
  H1_2: "1 с хендикап 0:2 (домакинът с 3+ гола)", H2_2: "2 с хендикап 2:0 (гостът с 3+ гола)",
  KH: "повече корнери - домакинът", KD: "равен брой корнери", KA: "повече корнери - гостът"};
const HCP = {H1: [1, 2], H2: [-1, 2], H1_2: [1, 3], H2_2: [-1, 3]};
// етикетът с имената на отборите вместо „домакинът“ / „гостът“ (хендикап, повече корнери)
const labT = (sel, m) => lab(sel).replace("домакинът", m.h).replace("гостът", m.a);
// хендикапът и повече корнери назад (research/handicap_corners_backtest.py)
const HC = DATA.hc_bt || null;
function lab(sel) {
  if (/^[CK][OU]/.test(sel)) return `${sel[0] === "C" ? "картони" : "корнери"} ${sel[1] === "O" ? "над" : "под"} ${sel.slice(2)}`;
  return LAB2[sel] || LABEL[sel] || sel;
}
// излязла ли е прогнозата; null - чака статистиката (картони/корнери идват 1-3 дни след мача)
function hitAny(sel, s, ct, cs) {
  if (HCP[sel]) return HCP[sel][0] * (s[0] - s[1]) >= HCP[sel][1];
  if (sel === "KH" || sel === "KD" || sel === "KA") {
    if (!cs || cs[0] == null || cs[1] == null) return null;
    return sel === "KH" ? cs[0] > cs[1] : sel === "KA" ? cs[0] < cs[1] : cs[0] === cs[1];
  }
  const lines = {O15: ["O", 1.5], U15: ["U", 1.5], O35: ["O", 3.5], U35: ["U", 3.5]};
  if (lines[sel]) return (s[0] + s[1] > lines[sel][1]) === (lines[sel][0] === "O");
  if (sel === "GG") return s[0] > 0 && s[1] > 0;
  if (sel === "NG") return s[0] === 0 || s[1] === 0;
  if (/^[CK][OU]/.test(sel)) { const t = (ct || [])[sel[0] === "C" ? 0 : 1]; if (t == null) return null; return (t > +sel.slice(2)) === (sel[1] === "O"); }
  return hit(sel, s);
}
const XK = {cards: "Картони", corners: "Корнери"};
// Имена на съдии има само football-data за Англия и Шотландия (и за предстоящите мачове - около седмица напред)
const REF_LEAGUES = ["E0", "E1", "E2", "E3", "EC", "SC0", "SC1", "SC2", "SC3"];
const XU = {cards: "жълти", corners: "корнера"};
const FLAG = {"Англия":"🇬🇧","Шотландия":"🇬🇧","Германия":"🇩🇪","Италия":"🇮🇹","Испания":"🇪🇸","Франция":"🇫🇷",
  "Нидерландия":"🇳🇱","Белгия":"🇧🇪","Португалия":"🇵🇹","Турция":"🇹🇷","Гърция":"🇬🇷","Аржентина":"🇦🇷","Австрия":"🇦🇹",
  "Бразилия":"🇧🇷","Китай":"🇨🇳","Дания":"🇩🇰","Финландия":"🇫🇮","Ирландия":"🇮🇪","Япония":"🇯🇵","Мексико":"🇲🇽",
  "Норвегия":"🇳🇴","Полша":"🇵🇱","Румъния":"🇷🇴","Русия":"🇷🇺","Швеция":"🇸🇪","Швейцария":"🇨🇭","САЩ":"🇺🇸",
  "Чили":"🇨🇱","Австралия":"🇦🇺","Корея":"🇰🇷","Саудитска Арабия":"🇸🇦","Европа":"🇪🇺","Южна Америка":"🌎","Национални":"🌍"};
const LABEL = {"1":"1","X":"X","2":"2","1X":"1X","X2":"X2","12":"12","O":"над 2.5","U":"под 2.5"};
const MKT = {"1x2":"1/X/2","dc":"Двоен шанс","ou":"Над/под 2.5"};
const FLAGS = {derby:["Дерби","warn"], after_break:["След паузата","warn"], toto:["Тото лига","warn"]};

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = (x, d = 0) => x == null || isNaN(x) ? "–" : (x * 100).toFixed(d) + "%";
const sgn = (x, d = 1) => x == null || isNaN(x) ? "–" : (x >= 0 ? "+" : "−") + Math.abs(x * 100).toFixed(d) + "%";
const chance = p => p == null ? "–" : p === 0 ? "0%" : p < 0.001 ? "<0.1%" : p < 0.1 ? (p * 100).toFixed(1) + "%" : p > 0.999 && p < 1 ? ">99.9%" : pct(p);
const eur = x => (x >= 0 ? "+" : "−") + Math.abs(x).toFixed(0) + " €";
const title = c => L[c] ? `${L[c].c} · ${L[c].n}` : c;
const flag = c => L[c] ? (FLAG[L[c].c] || "⚽") : "⚽";
const tz = "Europe/Sofia";
const fmtTime = iso => new Date(iso).toLocaleTimeString("bg-BG", {timeZone: tz, hour: "2-digit", minute: "2-digit"});
const fmtDate = iso => new Date(iso).toLocaleDateString("bg-BG", {timeZone: tz, weekday: "short", day: "2-digit", month: "2-digit"});
// "денят" на прогнозите започва в 07:00 българско време (същото като в bets/tips.py)
function dayKey(iso) {
  const d = new Date(new Date(iso).getTime() - 7 * 3600e3);
  return d.toLocaleDateString("sv-SE", {timeZone: tz});
}
function hit(sel, s) {
  const [h, a] = s, r = h > a ? "1" : h === a ? "X" : "2";
  if (sel === "1" || sel === "X" || sel === "2") return sel === r;
  if (sel === "1X" || sel === "X2" || sel === "12") return sel.includes(r);
  if (sel === "O") return h + a >= 3;
  if (sel === "U") return h + a <= 2;
  return false;
}
function store(key, val) { try { if (val === undefined) return localStorage.getItem(key); localStorage.setItem(key, val); } catch (e) { return null; } }

// ---------- тема ----------

  if (saved) document.documentElement.dataset.theme = saved;
  document.getElementById("theme").onclick = () => {
    const cur = document.documentElement.dataset.theme ||
      (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");

const tabs = [...document.querySelectorAll('[role="tab"]')];
function selectTab(id) {
  tabs.forEach(t => {
    const on = t.id === id;
    t.setAttribute("aria-selected", on);
    document.getElementById(t.getAttribute("aria-controls")).hidden = !on;
  });
  store("tab", id);
  if (location.hash !== "#" + id) history.replaceState(null, "", "#" + id);
}
tabs.forEach(t => t.addEventListener("click", () => selectTab(t.id)));

     Няма размер на залога и няма „сигурни“ залози.`;

// ======================= ПРОГНОЗИ =======================
// Започналият мач стои тук до 10 мин. след началото и после минава в „Резултати“ -> „Чакат резултат“
// (собственикът, 2026-10-01). По часовника на телефона - не по часа на обновяването; проверка всяка минута.
const LIVE_AFTER = 10 * 60e3;
const SETTLED = new Set((DATA.record || []).map(r => r.i));
const ALL = (DATA.pending || []).concat(DATA.upcoming || []).filter(m => !SETTLED.has(m.i));
const isPending = m => new Date(m.k).getTime() + LIVE_AFTER <= Date.now();
const UP = ALL.filter(m => !isPending(m));
// само записаните (честният запис) и само с прогноза на робота - без собствена оценка мачът е само в „Прогнози“
const PEND = ALL.filter(m => isPending(m) && m.lk && (m.b === "model" || m.t));
const OLD_RULES = ["market_likely", "likely"];     // главният съвет до 30.09 (1/X/2, двоен шанс, над/под 2.5)
const fc = {day: null, q: "", league: "", tip: false, sort: "time"};
function btTip(code) { const b = BT[code]; return b ? b[`tip:${RULE}:all`] : null; }

function initForecasts() {
  drawDays();
  document.getElementById("fc-q").oninput = e => { fc.q = e.target.value.trim().toLowerCase(); renderForecasts(); };
  document.getElementById("fc-league").onchange = e => { fc.league = e.target.value; renderForecasts(); };
  document.getElementById("fc-sort").onchange = e => { fc.sort = e.target.value; renderForecasts(); };
  document.getElementById("fc-tip").onchange = e => { fc.tip = e.target.checked; renderForecasts(); };
  fillLeagues();
  renderForecasts();
}

function drawDays() {
  const days = {};
  UP.forEach(m => { const k = dayKey(m.k); days[k] = (days[k] || 0) + 1; });
  const keys = Object.keys(days).sort();
  const today = dayKey(new Date().toISOString());
  if (!keys.includes(fc.day)) fc.day = keys.includes(today) ? today : keys[0];
  const tomorrow = dayKey(new Date(Date.now() + 864e5).toISOString());
  const box = document.getElementById("fc-days");
  box.innerHTML = keys.map(k => {
    const lbl = k === today ? "Днес" : k === tomorrow ? "Утре" :
      new Date(k + "T12:00:00").toLocaleDateString("bg-BG", {weekday: "short", day: "2-digit", month: "2-digit"});
    return `<button type="button" data-d="${k}" aria-pressed="${k === fc.day}">${lbl}<span class="c">${days[k]}</span></button>`;
  }).join("") || "";
  box.onclick = e => { const b = e.target.closest("button"); if (!b) return; fc.day = b.dataset.d;
    box.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); fillLeagues(); renderForecasts(); };
}

// всяка минута: мачовете, започнали преди 10 мин., минават от „Прогнози“ в „Чакат резултат“
setInterval(() => {
  const moved = UP.filter(isPending);
  if (!moved.length) return;
  moved.forEach(m => { UP.splice(UP.indexOf(m), 1); if (m.lk) PEND.push(m); });
  drawDays(); fillLeagues(); renderForecasts(); renderResults();
}, 60e3);

function fillLeagues() {
  const cnt = {};
  UP.filter(m => dayKey(m.k) === fc.day).forEach(m => cnt[m.l] = (cnt[m.l] || 0) + 1);
  const sel = document.getElementById("fc-league");
  const codes = Object.keys(cnt).sort((a, b) => title(a).localeCompare(title(b), "bg"));
  if (fc.league && !cnt[fc.league]) fc.league = "";
  const top = codes.filter(c => TOP10.includes(c)).reduce((a, c) => a + cnt[c], 0);
  if (fc.league === "__top10" && !top) fc.league = "";
  sel.innerHTML = `<option value="">Всички първенства (${codes.length})</option>` +
    (top ? `<option value="__top10" ${fc.league === "__top10" ? "selected" : ""}>Топ 10 първенства (${top})</option>` : "") +
    codes.map(c => `<option value="${c}" ${c === fc.league ? "selected" : ""}>${esc(title(c))} (${cnt[c]})</option>`).join("");
}

function probBar(r) {
  const p = [r["1"], r["X"], r["2"]].map(x => Math.max(0, x || 0));
  return `<div class="bar" aria-label="Роботът: 1 ${pct(p[0])}, X ${pct(p[1])}, 2 ${pct(p[2])}">
    <span class="h" style="flex:${p[0]}">1 ${pct(p[0])}</span><span class="d" style="flex:${p[1]}">X ${pct(p[1])}</span><span class="a" style="flex:${p[2]}">2 ${pct(p[2])}</span></div>`;
}

// Професионалистът (01.10): при голям фаворит - хендикап 0:1 (победа с 2+ гола); кой изпълнява повече корнери.
function hcpChip(m) {
  const g = (m.an || {}).goals;
  if (!g || !g.hcp) return "";
  const home = g.win[0] >= g.win[1], fp = home ? g.win[0] : g.win[1];
  const code = home ? "H1" : "H2", p2 = g.hcp[code];
  return `<span class="pk" title="Победа с 2+ гола разлика (хендикап ${home ? "0:1" : "1:0"}); с 3+ - ${pct(g.hcp[home ? "H1_2" : "H2_2"])}">${fp >= 0.6 ? "Голям фаворит" : "Хендикап"}: <b>${esc(home ? m.h : m.a)} с 2+ гола</b> <span class="num">${pct(p2)}</span></span>`;
}
function cornerChip(m) {
  const k = ((m.an || {}).corners || {}).more;
  if (!k) return "";
  const home = k.KH >= k.KA;
  return `<span class="pk" title="Повече корнери: ${esc(m.h)} ${pct(k.KH)}, равно ${pct(k.KD)}, ${esc(m.a)} ${pct(k.KA)}">Повече корнери: <b>${esc(home ? m.h : m.a)}</b> <span class="num">${pct(home ? k.KH : k.KA)}</span>${Math.abs(k.KH - k.KA) < 0.15 ? ` <span class="muted">(равен мач)</span>` : ""}</span>`;
}

function matchCard(m) {
  const flags = (m.f || []).map(f => FLAGS[f] ? `<span class="badge ${FLAGS[f][1]}">${FLAGS[f][0]}</span>` : "").join("");
  const state = m.lk ? `<span class="badge ok" title="Записано ${fmtTime(m.lk)} - не се променя">записано</span>`
                     : `<span class="badge" title="Записва се сутринта в деня на мача">предварително</span>`;
  let body = "";
  if (!m.b) {
    body = `<div class="tip none">Без прогноза: ${esc(m.w || "няма данни")}</div>`;
  } else {
    const r = m.r, mk = m.m || {}, o = m.o || {};
    const sub = [];
    if (mk["1"] != null) sub.push(`пазарът: ${pct(mk["1"])} / ${pct(mk["X"])} / ${pct(mk["2"])}`);
    if (r.O != null) sub.push(`над 2.5: ${pct(r.O)}${mk.O != null ? ` (пазарът ${pct(mk.O)})` : ""}`);
    if (m.xg) sub.push(`очаквани голове ${m.xg[0].toFixed(1)} : ${m.xg[1].toFixed(1)}`);
    sub.push(m.b === "model" ? "процентите са на робота" : "роботът няма собствена оценка - процентите са на букмейкъра");
    const an = m.an || {};
    const picks = m.b !== "model" ? "" : Object.entries(m.pk || {}).map(([mkt, sel]) =>
      `<span class="pk">${MKT[mkt]}: <b>${LABEL[sel]}</b> <span class="num">${pct(r[sel])}${o[sel] ? " @" + o[sel].toFixed(2) : ""}</span></span>`).join("") +
      ["cards", "corners"].filter(k => an[k]).map(k => { const x = an[k], ch = x.pick === "O" ? x.over : 1 - x.over;
        return x.skill
          ? `<span class="pk">${XK[k]}: <b>${x.pick === "O" ? "над" : "под"} ${x.line}</b> <span class="num">${pct(ch)}</span></span>`
          : `<span class="pk" title="Очакван брой по робота. Проверката назад не показа, че процентът му е по-точен от средното на лигата - затова процент няма.">${XK[k]}: очаквани <b class="num">${x.total.toFixed(1)}</b>${x.base != null ? ` <span class="muted">· в лигата над ${x.line}: ${pct(x.base)}</span>` : ""}</span>`; }).join("") +
      hcpChip(m) + cornerChip(m) +
      (an.referee && an.referee.last ? `<span class="pk" title="Съдията в последните си ${an.referee.last.n} мача">Съдия: <b>${esc(an.referee.name)}</b> <span class="num">${an.referee.last.yellows.toFixed(1)} жълти/мач</span>${an.referee.league ? ` <span class="muted">(лигата ${an.referee.league.yellows.toFixed(1)})</span>` : ""}</span>` : "");
    let tip;
    const one = m.one ? `<div class="one"><span class="ol">Прогнозата на робота - една за мача</span><b class="ov">${esc(labT(m.one[0], m))}</b>
        <span class="om">шанс ${pct(m.one[1])} по робота · коеф. ${m.one[2] ? m.one[2].toFixed(2) : "–"}${m.one[3] === "robot" ? " (по робота - от букмейкърите няма коефициент)" : ""}${m.one[4] === false ? ` · в мача няма събитие с шанс 50%+ ${ONE_TXT} - това е най-вероятното от ${RG.floor.toFixed(2)} нагоре` : ""}</span>
        ${oneBack() ? `<span class="om">${oneBack()}</span>` : ""}</div>` : "";
    if (m.one || m.rk || m.sf) {
      const odd = x => x[2] ? ` · коеф. ${x[2].toFixed(2)}${x[4] === "robot" ? " (по робота - букмейкърите още нямат)" : ""}` : "";
      tip = `${one}${one ? `<div class="others">Другите прогнози (за сведение - мери се само горната)</div>` : ""}<div class="preds">
        ${m.rk ? `<div class="pred risky"><span class="pl">Рискова прогноза (${RISKY_TXT})</span><b class="pv">${esc(labT(m.rk[0], m))}${m.rk[0] === "1" || m.rk[0] === "2" ? ` <span class="muted small">(${esc(m.rk[0] === "1" ? m.h : m.a)})</span>` : ""}</b>
          <span class="pm">шанс ${pct(m.rk[1])} по робота${m.rk[3] ? ` · обикновено в лигата ${pct(m.rk[3])}` : ""}${odd(m.rk)}</span></div>` : (RG.risky === "under50" && !m.lk || (m.lk && m.lk >= "2026-10-03") ? `<div class="pred risky"><span class="pl">Рискова прогноза</span><span class="pm">няма - ясен фаворит (над 50% по робота); фаворитът не е риск</span></div>` : "")}
        ${m.sf ? `<div class="pred safe"><span class="pl">По-сигурна прогноза (${SAFE_TXT})</span><b class="pv">${lab(m.sf[0])}</b>
          <span class="pm">шанс ${pct(m.sf[1])} по робота${odd(m.sf)}</span></div>`
          : `<div class="pred safe"><span class="pl">По-сигурна прогноза (${SAFE_TXT})</span><span class="pm">няма събитие с коефициент ${SAFE_TXT}</span></div>`}</div>
        ${(m.f || []).includes("derby") ? `<div class="pred-note"><b>Дерби</b> - професионалистът: избягвай за залог.</div>` : ""}`;
    } else if (m.t && m.rl === "market_likely" && !m.one) {
      // записан сутринта преди смяната на правилото (30.09) - по букмейкъра; записът не се пипа
      const nt = ownTip(m);
      tip = `<div class="tip none"><span>Съвет по старото правило: <b>${LABEL[m.t]}</b> @ <b class="num">${m.to.toFixed(2)}</b></span>
        <span class="meta">Записан${m.lk ? " в " + fmtTime(m.lk) : ""} преди смяната на правилото - избран по процента на букмейкъра (${pct(mk[m.t])}), не по робота. По новото правило на робота тук: ${nt ? `<b>${LABEL[nt]}</b> @ ${o[nt].toFixed(2)} (${pct(r[nt])})` : "без съвет"}.</span></div>`;
    } else if (m.t && OLD_RULES.includes(m.rl)) {
      const bt = btTip(m.l);
      const why = whyNot(m);
      tip = `<div class="tip"><span>Съвет: <b>${LABEL[m.t]}</b> @ <b class="num">${m.to.toFixed(2)}</b></span>
        <span class="meta">шанс ${pct(r[m.t])} по робота (коефициентът не влиза в процента)${mk[m.t] != null ? ` · букмейкърът: ${pct(mk[m.t])}` : ""}${m.tb && m.tb > m.to + 0.005 ? ` · най-добра цена ${m.tb.toFixed(2)}` : ""}${bt ? ` · в тази лига съветите познават ${pct(bt.hit)} (назад, ${bt.n} мача)` : ""}</span>
        ${why ? `<span class="meta" style="flex-basis:100%">${esc(why)} Съветът е най-вероятният изход с шанс над 50% и коефициент поне 1.40.</span>` : ""}</div>`;
    } else {
      tip = `<div class="tip none">Без прогноза на робота - ${esc(m.w || "")}</div>`;
    }
    body = probBar(r) + `<div class="sub">${sub.map(esc).join("<span aria-hidden='true'>·</span>")}</div>
      <div class="picks">${picks}</div>${tip}${bonusBlock(m)}${analysisBlock(m)}`;
  }
  return `<div class="m"><div class="top"><span class="time">${fmtTime(m.k)}</span>
    <span class="teams">${esc(m.h)} – ${esc(m.a)}</span><span class="flags">${flags}${state}</span></div>${body}</div>`;
}

// Правилото за съвета (bets/robot.py, RULE = "likely"): най-вероятният изход по робота с шанс поне 50%
// и коефициент поне 1.40, без дерби и без фаворит 1.30-1.55 в тото лига.
const SELS = ["1", "X", "2", "1X", "X2", "12", "O", "U"];
function ownTip(m) {
  if ((m.f || []).includes("derby")) return null;
  const o = m.o || {}, toto = (m.f || []).includes("toto");
  const c = SELS.filter(s => m.r[s] != null && o[s] >= 1.40 && m.r[s] >= 0.5 &&
                             !(toto && (s === "1" || s === "2") && o[s] <= 1.55 && o[s] >= 1.30));
  return c.sort((a, b) => m.r[b] - m.r[a])[0] || null;
}
function whyNot(m) {
  // защо изборите над съвета не са съвет - за всеки различен от него
  const o = m.o || {}, out = [];
  Object.values(m.pk || {}).forEach(s => {
    if (s === m.t) return;
    const p = m.r[s];
    const reason = p < 0.5 ? "шансът е под 50%" : !o[s] ? "няма коефициент" : o[s] < 1.40 ? `коефициентът ${o[s].toFixed(2)} е под 1.40` : "по-малък шанс от съвета";
    out.push(`${LABEL[s]} (${pct(p)}) - ${reason}`);
  });
  return out.length ? `Защо не другите: ${out.join("; ")}.` : "";
}

function bonusBlock(m) {
  const b = BONUS[m.i];
  if (!TOP5.includes(m.l)) return "";
  if (!b) {
    if (new Date(m.k).getTime() <= Date.now()) return "";
    const at = new Date(new Date(m.k).getTime() - 3600e3);
    return `<div class="bonus"><b class="t">Бонус анализ</b>ще е в ${fmtTime(at.toISOString())} (час преди мача) - с известие дали има промени.</div>`;
  }
  const cur = [["one", "ПРОГНОЗАТА"], ["rk", "рискова"], ["sf", "по-сигурна"]].filter(([k]) => b[k]).map(([k, n]) => `${n} <b>${lab(b[k][0])}</b> @${b[k][2].toFixed(2)} (${pct(b[k][1])})`).join(" · ");
  return `<div class="bonus ${b.ch.length ? "changed" : ""}"><b class="t">Бонус анализ ${fmtTime(b.at)} (час преди)</b>
    ${b.ch.length ? `<b>Промени спрямо сутринта:</b><ul>${b.ch.map(c => `<li>${esc(c)}</li>`).join("")}</ul>` : "Без промяна спрямо сутрешната прогноза."}
    ${cur ? `<div>Сега: ${cur}</div>` : ""}</div>`;
}

async function fetchBonus() {
  // мачовете от топ 5, започващи до 3 часа: дотегля готовите бонус анализи без да чака часовото обновяване
  const now = Date.now();
  const want = [...new Set(ALL.filter(m => TOP5.includes(m.l) && !BONUS[m.i] && new Date(m.k) - now < 3 * 3600e3 && new Date(m.k) - now > -2 * 3600e3).map(m => slotName(m.k)))];
  let got = 0;
  for (const name of want) {
    try {
      const r = await fetch(`bonus/${name}.json?t=${now}`, {cache: "no-store"});
      if (!r.ok) continue;
      const d = await r.json();
      d.matches.forEach(x => { BONUS[x.id] = {at: d.made_at, ch: x.changes, one: x.new && x.new.one ? [x.new.one.sel, x.new.one.p, x.new.one.odds, x.new.one.src, x.new.one.band] : null,
                                          rk: x.new && x.new.risky ? [x.new.risky.sel, x.new.risky.p, x.new.risky.odds] : null,
                                          sf: x.new && x.new.safer ? [x.new.safer.sel, x.new.safer.p, x.new.safer.odds] : null}; got++; });
    } catch (e) { /* няма още файл - нищо */ }
  }
  if (got) { renderForecasts(); renderResults(); }
}

// Резултатите до минути след края (bets/live.py пише results/<ден>.json): страницата ги дотегля сама
// всяка минута и мести мача от „Чакат резултат“ в „Мач по мач“, без да чака часовото обновяване.
function toRecord(m, x) {
  const an = m.an || {}, ex = {};
  ["cards", "corners"].forEach(k => { if (an[k]) ex[k] = [an[k].pick, an[k].line, null, an[k].total]; });
  return {i: m.i, k: m.k, l: m.l, h: m.h, a: m.a, b: m.b, s: x.s, pk: m.pk || {}, mk: {}, r: m.r || {}, o: m.o || {},
          xg: m.xg || null, t: m.t, to: m.to, rl: m.rl, rk: m.rk, sf: m.sf, one: m.one, ct: [null, null], f: m.f || [],
          w: m.w, x: ex, ref: an.referee ? an.referee.name : null, ya: [null, null], cs: [null, null], fast: x.at, fastSrc: x.src,
          hp: (an.goals || {}).hcp || null, kp: (an.corners || {}).more || null};
}
async function fetchResults() {
  // само мачовете с бърз източник (odds API), започнали преди повече от 95 мин.
  const due = PEND.filter(m => L[m.l] && L[m.l].fast && Date.now() - new Date(m.k).getTime() > 95 * 60e3);
  if (!due.length) return;
  let moved = 0;
  try {
    const r = await fetch(`results/live.json?t=${Date.now()}`, {cache: "no-store"});
    if (r.ok) {
      const d = await r.json();
      due.forEach(m => { const x = d[m.i]; if (!x || !PEND.includes(m)) return;
        PEND.splice(PEND.indexOf(m), 1); REC.push(toRecord(m, x)); moved++; });
    }
  } catch (e) { /* няма връзка - следващата минута */ }
  if (moved) { REC.sort((a, b) => b.k.localeCompare(a.k)); renderResults(); }
}

function roundPanel(rows) {
  const name = fc.league === "__top10" ? "Топ 10 първенства" : title(fc.league);
  const g = rows.filter(m => m.an && m.an.goals);
  const nm = m => `${esc(m.h)} – ${esc(m.a)}`;
  const tot = m => m.an.goals.xg[0] + m.an.goals.xg[1];
  const items = [];
  if (g.length) {
    const s = g.slice().sort((a, b) => tot(b) - tot(a));
    const sum = g.reduce((x, m) => x + tot(m), 0);
    items.push(`Очаквани голове общо <b>${sum.toFixed(1)}</b> в ${g.length} мача (средно ${(sum / g.length).toFixed(2)} на мач).`);
    items.push(`Най-много голове се очакват в: ${s.slice(0, 3).map(m => `${nm(m)} (${tot(m).toFixed(1)})`).join(", ")}.`);
    items.push(`Най-малко: ${s.slice(-3).reverse().map(m => `${nm(m)} (${tot(m).toFixed(1)})`).join(", ")}.`);
  }
  ["cards", "corners"].forEach(k => {
    const x = rows.filter(m => m.an && m.an[k]).sort((a, b) => b.an[k].total - a.an[k].total);
    if (x.length) items.push(`Най-много ${XU[k]} се очакват в: ${x.slice(0, 3).map(m => `${nm(m)} (${m.an[k].total.toFixed(1)})`).join(", ")}; най-малко - ${nm(x[x.length - 1])} (${x[x.length - 1].an[k].total.toFixed(1)}).`);
  });
  const pr = rows.filter(m => m.rk);
  const bySign = s => pr.filter(m => m.rk[0] === s);
  if (pr.length) items.push(`Рисковите прогнози: 1 - ${bySign("1").length}, X - ${bySign("X").length}, 2 - ${bySign("2").length}.` +
    (bySign("X").length ? ` X: ${bySign("X").map(m => `${nm(m)} (${pct(m.rk[1])})`).join(", ")}.` : ""));
  const ones = rows.filter(m => m.one);
  if (ones.length) {
    const kinds = {};
    ones.forEach(m => { const k = lab(m.one[0]); kinds[k] = (kinds[k] || 0) + 1; });
    items.push(`Прогнозата на робота (една за мач): ${Object.entries(kinds).sort((a, b) => b[1] - a[1]).map(([k, n]) => `${k} - ${n}`).join(", ")}.`);
    const top = ones.slice().sort((a, b) => b.one[1] - a.one[1]).slice(0, 5);
    items.push(`С най-голям шанс: ${top.map(m => `${nm(m)} - <b>${esc(labT(m.one[0], m))}</b> ${pct(m.one[1])}`).join("; ")}.`);
  }
  const top1 = p => ["1", "X", "2"].reduce((a, b) => (p[b] || 0) > (p[a] || 0) ? b : a, "1");
  const dis = rows.filter(m => m.b === "model" && m.m && m.m["1"] != null && top1(m.m) !== m.pk["1x2"]);
  if (dis.length) items.push(`Роботът вижда различно от букмейкъра (1/X/2): ${dis.slice(0, 6).map(m => `${nm(m)} - роботът ${m.pk["1x2"]} (${pct(m.r[m.pk["1x2"]])}), букмейкърът ${top1(m.m)} (${pct(m.m[top1(m.m)])})`).join("; ")}${dis.length > 6 ? ` и още ${dis.length - 6}` : ""}.`);
  const favs = rows.filter(m => m.an && m.an.goals && m.an.goals.hcp && Math.max(...m.an.goals.win) >= 0.6)
    .map(m => { const g = m.an.goals, home = g.win[0] >= g.win[1]; return {m, home, p: g.hcp[home ? "H1" : "H2"]}; })
    .sort((a, b) => b.p - a.p);
  if (favs.length) items.push(`Големи фаворити - победа с 2+ гола разлика (хендикап): ${favs.slice(0, 6).map(x => `${nm(x.m)} - <b>${esc(x.home ? x.m.h : x.m.a)}</b> ${pct(x.p)}`).join("; ")}${favs.length > 6 ? ` и още ${favs.length - 6}` : ""}.`);
  const kc = rows.filter(m => m.an && m.an.corners && m.an.corners.more);
  const kSure = kc.map(m => { const k = m.an.corners.more, home = k.KH >= k.KA; return {m, home, p: home ? k.KH : k.KA, close: Math.abs(k.KH - k.KA) < 0.15}; })
    .sort((a, b) => b.p - a.p);
  if (kSure.length) items.push(`Повече корнери - най-ясно: ${kSure.slice(0, 4).map(x => `${nm(x.m)} - <b>${esc(x.home ? x.m.h : x.m.a)}</b> ${pct(x.p)}`).join("; ")}.` +
    (kSure.some(x => x.close) ? ` Равни мачове (роботът почти не различава): ${kSure.filter(x => x.close).slice(0, 4).map(x => nm(x.m)).join(", ")}.` : ""));
  const der = rows.filter(m => (m.f || []).includes("derby"));
  if (der.length) items.push(`Дерби (без съвет): ${der.map(nm).join(", ")}.`);
  if (rows.some(m => (m.f || []).includes("after_break"))) items.push(`Първи кръг след паузата - професионалистът очаква повече изненади.`);
  if (fc.league === "__top10" && !rows.some(m => m.l === "BUL")) items.push(`<span class="muted">България: още няма източник на данни (нужен е ключ за API-Football).</span>`);
  return items.length ? `<div class="panel round"><h3>Анализ на кръга: ${esc(name)}</h3><ul>${items.map(x => `<li>${x}</li>`).join("")}</ul></div>` : "";
}

  if (a && a.goals && a.goals.last3) out.push(`<span class="badge">голове ${a.goals.last3.avg.toFixed(2)}</span>`);
  const sl = (SB.leagues || {})[code];
  if (sl && sl.risky && sl.safer) out.push(`<span class="badge" title="Назад във времето (2023-2026): колко често излизат рисковата и по-сигурната прогноза">рискова ${pct(sl.risky.hit)} · по-сигурна ${pct(sl.safer.hit)}</span>`);
  if (L[code] && L[code].src === "api") out.push(`<span class="badge" title="Няма история - прогнозата е на пазара">по пазара</span>`);

}

function renderForecasts() {
  let rows = UP.filter(m => dayKey(m.k) === fc.day);
  const all = rows;
  if (fc.league === "__top10") rows = rows.filter(m => TOP10.includes(m.l));
  else if (fc.league) rows = rows.filter(m => m.l === fc.league);
  if (fc.q) rows = rows.filter(m => (m.h + " " + m.a + " " + title(m.l)).toLowerCase().includes(fc.q));
  if (fc.tip) rows = rows.filter(m => m.one || m.rk);
  const note = [];
  const withTip = all.filter(m => m.one || m.rk).length;
  const xs = all.filter(m => m.rk && m.rk[0] === "X").length;
  const locked = all.filter(m => m.lk).length;
  note.push(`<b>${all.length}</b> мача в <b>${new Set(all.map(m => m.l)).size}</b> първенства · с прогноза на робота <b>${withTip}</b> (с рискова <b>${all.filter(m => m.rk).length}</b>) · записани <b>${locked}</b>`);
  const breaks = [...new Set(all.filter(m => (m.f || []).includes("after_break")).map(m => m.l))];
  const derb = all.filter(m => (m.f || []).includes("derby"));
  let html = `<div class="note">${note.join("")}${locked < all.length ? `<br><span class="muted small">Прогнозата се записва сутринта в деня на мача (след 07:00) и после не се променя. Дотогава е предварителна.</span>` : ""}
    <br><span class="muted small"><b>Прогнозата на робота</b> - ЕДНА за мача (професионалистът: „точно една, за да видим точно какъв процент държи“): най-вероятното по робота събитие от всички пазари - 1/X/2, двоен шанс, голове над/под 1.5/2.5/3.5, двата вкарват, картони, корнери, хендикап - с коефициент ${ONE_TXT} (професионалистът: нищо под 1.40). ${oneBack() ? oneBack().replace(/^н/, "Н") + "." : ""}</span>
    <br><span class="muted small">Освен нея - две прогнози за сведение; <b>шансът е на робота</b>, коефициентът само казва сигурно ли е или рисково: <b>по-сигурна</b> (зелено) - най-вероятното събитие (1, 2, двоен шанс, над/под 2.5) с коефициент <b>${SAFE_TXT}</b> и шанс 50%+ (назад: познава 59%); <b>рискова</b> - <b>знак 1 или 2</b>, който роботът дава под 50% - по-вероятният от двата отбора (назад: 42% при ср. коеф. 2.3); при ясен фаворит (над 50%) рискова няма - фаворитът не е риск.</span></div>`;
  if (breaks.length) html += `<div class="note warn"><b>Първи кръг след паузата</b> в ${breaks.length} първенства. Професионалистът: след пауза има повече изненади. Данните от 12 400 такива мача досега не го потвърждават (фаворитите печелят колкото обещава коефициентът) - следи се тук.</div>`;
  if (derb.length) html += `<div class="note warn"><b>Дерби</b>: ${derb.map(m => esc(m.h + " – " + m.a)).join("; ")}. Професионалистът: избягвай - роботът не дава съвет.</div>`;
  if (!rows.length) { document.getElementById("fc-note").innerHTML = html; document.getElementById("fc-list").innerHTML = `<div class="empty">Няма мачове по този избор.</div>`; return; }
  if (fc.league) html += roundPanel(rows);
  if (fc.sort === "sure") {
    const main = m => m.one || m.sf;
    const sure = m => main(m)[1];      // шансът на робота за едната прогноза - не на коефициентите
    const t = rows.filter(main).sort((a, b) => sure(b) - sure(a));
    const rest = rows.filter(m => !main(m)).sort((a, b) => a.k.localeCompare(b.k));
    document.getElementById("fc-note").innerHTML = html;
    document.getElementById("fc-list").innerHTML = t.concat(rest).map(m =>
      `<div class="small muted" style="margin:8px 2px 3px">${flag(m.l)} ${esc(title(m.l))}</div>` + matchCard(m)).join("");
    return;
  }
  const groups = {};
  rows.sort((a, b) => a.k.localeCompare(b.k)).forEach(m => (groups[m.l] = groups[m.l] || []).push(m));
  const order = Object.keys(groups).sort((a, b) => groups[a][0].k.localeCompare(groups[b][0].k) || title(a).localeCompare(title(b), "bg"));
  html = html;
  document.getElementById("fc-note").innerHTML = html;
  document.getElementById("fc-list").innerHTML = order.map(c =>
    `<div class="lg"><h3>${flag(c)} ${esc(title(c))}</h3>${leagueBadges(c)}</div>` + groups[c].map(matchCard).join("")).join("");
}

// ======================= РЕЗУЛТАТИ =======================
const REC = (DATA.record || []).slice().sort((a, b) => b.k.localeCompare(a.k));
const PERIODS = [["7", "7 дни"], ["14", "2 седмици"], ["30", "Месец"], ["61", "2 месеца"], ["92", "3 месеца"], ["183", "6 месеца"]];
const FILTERS = [["all", "Всички"], ["tip", "Само със съвет"], ["break", "След паузата"], ["derby", "Дербита"]];
const rs = {period: store("rs-period") || "30", filter: "all", shown: 60, sortKey: "n", sortDir: -1};

function money(rows) {
  const pr = rows.filter(r => r.t && r.to).map(r => hit(r.t, r.s) ? r.to - 1 : -1);
  if (!pr.length) return null;
  const mu = pr.reduce((a, b) => a + b, 0) / pr.length;
  const sd = Math.sqrt(pr.reduce((a, b) => a + (b - mu) ** 2, 0) / Math.max(1, pr.length - 1));
  return {n: pr.length, roi: mu, se: sd / Math.sqrt(pr.length), sum: mu * pr.length * STAKE,
          odds: rows.filter(r => r.t && r.to).reduce((a, r) => a + r.to, 0) / pr.length};
}
function hits(rows, who, mkt) {
  const key = who === "robot" ? "pk" : "mk";
  // без модел изборите „на робота“ са всъщност на букмейкъра - не се броят; и пазарът се сравнява
  // на същите мачове (само тези, за които роботът има собствена оценка)
  const xs = rows.filter(r => r[key] && r[key][mkt] && r.b === "model");
  if (!xs.length) return null;
  const h = xs.filter(r => hit(r[key][mkt], r.s)).length;
  return {n: xs.length, h, p: h / xs.length, se: Math.sqrt(h / xs.length * (1 - h / xs.length) / xs.length)};
}

function initResults() {
  const pb = document.getElementById("rs-period");
  pb.innerHTML = PERIODS.map(([k, l]) => `<button type="button" data-p="${k}" aria-pressed="${k === rs.period}">${l}</button>`).join("");
  pb.onclick = e => { const b = e.target.closest("button"); if (!b) return; rs.period = b.dataset.p; store("rs-period", rs.period);
    pb.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); rs.shown = 60; renderResults(); };
  const fb = document.getElementById("rs-filter");
  fb.innerHTML = FILTERS.map(([k, l]) => `<button type="button" data-f="${k}" aria-pressed="${k === rs.filter}">${l}</button>`).join("");
  fb.onclick = e => { const b = e.target.closest("button"); if (!b) return; rs.filter = b.dataset.f;
    fb.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); rs.shown = 60; renderResults(); };
  renderResults();
}

// Един мач в „Резултати“: до резултата ✓/✗ на прогнозата 1/X/2 (собственикът, 2026-10-01: „хиксът зависи
// от 1 X 2 прогнозата, за всички мачове“). При ✓ - само „Подробно“; при ✗ - отдолу 1/X/2 и другите прогнози, и
// „Подробно“: шансовете за 1/X/2 и кое излезе, двоен шанс, над/под, очаквани голове, картони, корнери,
// съдията, бонусът. Където източникът няма данни (картони, съдии) - пише го, вместо да мълчи.
function resultRow(r) {
  const hm = sel => hitAny(sel, r.s, r.ct, r.cs);
  const mk = h => h == null ? `<span class="muted">чака</span>` : h ? `<span class="y">✓</span>` : `<span class="n">✗</span>`;
  const R = r.r || {}, O = r.o || {}, own = r.b === "model";
  const p1 = (r.pk || {})["1x2"];
  // голямата отметка: едната прогноза на робота (от 02.10); по-старите записи - прогнозата 1/X/2
  const main = r.one ? [labT(r.one[0], r), hm(r.one[0])] : p1 ? [`1/X/2: ${LABEL[p1]}`, hit(p1, r.s)] : null;
  const mh = main ? main[1] : null;
  const big = !main ? `<span class="big w" title="Без прогноза">–</span>`
    : mh == null ? `<span class="big w" title="${esc(main[0])}: чака статистиката">…</span>`
    : mh ? `<span class="big y" title="${esc(main[0])} - излезе">✓</span>` : `<span class="big n" title="${esc(main[0])} - не излезе">✗</span>`;
  const chip1 = r.one && p1 ? `<span class="chip1" title="Прогнозата 1/X/2">1/X/2 ${LABEL[p1]} ${mk(hit(p1, r.s))}</span>` : "<span></span>";
  const oneLine = r.one ? `<span class="pk"><b>Прогнозата: ${esc(labT(r.one[0], r))}</b> ${pct(r.one[1])}${r.one[2] ? ` @${r.one[2].toFixed(2)}` : ""} ${mk(hm(r.one[0]))}</span>` : "";
  const predLine = (name, x) => x ? `<span class="pk"><b>${name}: ${lab(x[0])}</b>${x[1] != null ? " " + pct(x[1]) : ""}${x[2] ? ` @${x[2].toFixed(2)}` : ""} ${mk(hm(x[0]))}</span>` : "";
  const old = r.t && OLD_RULES.includes(r.rl) ? `<span class="pk"><b>Съвет ${LABEL[r.t]}</b> @${(r.to || 0).toFixed(2)} ${mk(hm(r.t))} <span class="muted">(${r.rl === "market_likely" ? "старото правило - по букмейкъра" : "правилото до 30.09"})</span></span>` : "";
  const x12 = p1 ? `<span class="pk">1/X/2: <b>${LABEL[p1]}</b>${R[p1] != null ? " " + pct(R[p1]) : ""}${O[p1] ? ` @${O[p1].toFixed(2)}` : ""} ${mk(hit(p1, r.s))}</span>` : "";
  const preds = predLine("Рискова", r.rk) + predLine("По-сигурна", r.sf) + old;
  const res = r.s[0] > r.s[1] ? "1" : r.s[0] === r.s[1] ? "X" : "2";
  const dd = [];
  if (preds) dd.push([r.one ? "Другите" : "Прогнози", preds]);
  if (R["1"] != null) dd.push(["1 / X / 2", ["1", "X", "2"].map(k => `<span class="${k === res ? "won" : "alt"}">${k} ${pct(R[k])}${O[k] ? ` @${O[k].toFixed(2)}` : ""}</span>`).join(" · ") +
    ` · излезе <b>${res}</b>${p1 ? ` · изборът ${LABEL[p1]} ${mk(hit(p1, r.s))}` : ""}`]);
  const one = (name, key) => { const sel = (r.pk || {})[key]; if (!sel) return;
    dd.push([name, `<b>${LABEL[sel]}</b>${R[sel] != null ? " " + pct(R[sel]) : ""}${O[sel] ? ` @${O[sel].toFixed(2)}` : ""} ${mk(hit(sel, r.s))}${key === "ou" ? ` · голове ${r.s[0] + r.s[1]}` : ""}`]); };
  one("Двоен шанс", "dc");
  one("Над/под 2.5", "ou");
  if (R["1"] != null) dd.push(["", `<span class="muted small">${own ? "шансовете са на робота; коефициентите - средните на букмейкърите при записа" : "роботът нямаше собствена оценка за тези отбори - шансовете са на букмейкъра"}</span>`]);
  if (r.xg) dd.push(["Очаквани голове", `${r.xg[0].toFixed(1)} : ${r.xg[1].toFixed(1)} · станаха <b>${r.s[0]} : ${r.s[1]}</b>`]);
  if (r.hp) dd.push(["Хендикап", ["H1", "H2"].map(k => `${esc(labT(k, r))} ${pct(r.hp[k])} ${mk(hitAny(k, r.s, r.ct, r.cs))}`).join(" · ")]);
  if (r.kp) dd.push(["Повече корнери", `${esc(r.h)} ${pct(r.kp.KH)} · равно ${pct(r.kp.KD)} · ${esc(r.a)} ${pct(r.kp.KA)}` +
    (r.cs && r.cs[0] != null ? ` · станаха <b>${r.cs[0]}:${r.cs[1]}</b> ${mk(hitAny(r.kp.KH >= r.kp.KA ? "KH" : "KA", r.s, r.ct, r.cs))}` : ` · <span class="muted">броят идва от football-data 1-3 дни след мача</span>`)]);
  const hasStats = r.ct && (r.ct[0] != null || r.ct[1] != null);
  ["cards", "corners"].forEach((k, i) => {
    const v = (r.x || {})[k];
    if (v) {
      const h = v[2] == null ? null : (v[0] === "O" ? v[2] > v[1] : v[2] < v[1]);
      dd.push([XK[k], `${v[3] != null ? `очаквани ${(+v[3]).toFixed(1)} · ` : ""}изборът ${v[0] === "O" ? "над" : "под"} ${v[1]} ${mk(h)}${v[2] != null ? ` · станаха <b>${v[2]}</b>` : " · броят идва от football-data 1-3 дни след мача"}`]);
    } else if (r.ct && r.ct[i] != null) {
      dd.push([XK[k], `станаха <b>${r.ct[i]}</b> ${XU[k]}`]);
    } else {
      dd.push([XK[k], `<span class="muted">${hasStats ? "няма ги в данните за този мач"
        : L[r.l] && L[r.l].src === "fd" ? "броят идва от football-data 1-3 дни след мача"
        : "няма данни за това първенство (картони и корнери дава само football-data за 22 първенства)"}</span>`]);
    }
  });
  dd.push(["Съдия", r.ref ? `${esc(r.ref)}${r.ya && r.ya[0] != null ? ` · в мача ${r.ya[0] + r.ya[1]} жълти (${r.ya[0]}-${r.ya[1]})` : ""}`
    : `<span class="muted">${REF_LEAGUES.includes(r.l) ? "името още не е качено" : "няма данни - имената на съдиите идват само за Англия и Шотландия"}</span>`]);
  const bo = BONUS[r.i];
  if (bo) dd.push(["Бонус анализ", `${bo.ch.length ? esc(bo.ch.join("; ")) : "без промяна спрямо сутринта"}${bo.one ? ` · прогнозата ${lab(bo.one[0])} ${mk(hm(bo.one[0]))}` : ""}${bo.sf ? ` · по-сигурна ${lab(bo.sf[0])} ${mk(hm(bo.sf[0]))}` : ""}${bo.rk ? ` · рискова ${lab(bo.rk[0])} ${mk(hm(bo.rk[0]))}` : ""}`]);
  if (r.fast) dd.push(["Резултатът", `<span class="muted small">от ${r.fastSrc === "espn" ? "ESPN" : "odds API"} в ${fmtTime(r.fast)}, минути след края; официалният от football-data го сверява до 1-3 дни</span>`]);
  if (r.w && !p1) dd.push(["Защо без прогноза", esc(r.w)]);
  const details = `<details class="an"><summary>Подробно</summary><dl class="dl">${dd.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl></details>`;
  const oneBox = r.one ? `<div class="onebox"><span class="ol">Прогнозата на робота</span><b>${esc(labT(r.one[0], r))}</b>
    <span class="muted">${pct(r.one[1])}${r.one[2] ? ` @${r.one[2].toFixed(2)}${r.one[3] === "robot" ? " (по робота)" : ""}` : ""}</span>
    ${mh == null ? `<span class="muted">чака статистиката</span>` : mh ? `<span class="y">✓ излезе</span>` : `<span class="n">✗ не излезе</span>`}</div>` : "";
  const lost = mh === false ? `<div class="lost">${x12}${r.one ? "" : preds}</div>` : "";
  return `<div class="rs2"><div class="top"><span class="muted num">${fmtTime(r.k)}</span>
      <span>${esc(r.h)} – ${esc(r.a)} <span class="muted small">${flag(r.l)} ${esc(L[r.l] ? L[r.l].n : r.l)}</span></span>
      ${chip1}<span class="sc">${r.s[0]}:${r.s[1]}</span>${big}</div>${oneBox}${lost}${details}</div>`;
}

// „Чакат резултат“: свито; вдясно стрелка. Вътре - всеки мач с всичко, което имаше в „Прогнози“.
function pendingBox() {
  if (!PEND.length) return "";
  const xs = PEND.slice().sort((a, b) => a.k.localeCompare(b.k));
  return `<details class="pend" id="rs-pend"><summary><span>Чакат резултат: <b>${xs.length}</b> ${xs.length === 1 ? "мач" : "мача"}</span><span class="arr" aria-hidden="true">▾</span></summary>
    <div class="inner"><div class="muted small" style="margin:0 2px 6px">Мачът идва тук 10 мин. след началото и минава в „Мач по мач“ до няколко минути след края - страницата проверява всяка минута. Резултатът идва от odds API, а за Англия 5-то ниво, Шотландия 2-4 и Румъния - от таблото на ESPN; официалният от football-data го сверява до 1-3 дни.</div>
    ${xs.map(m => `<div class="small muted" style="margin:10px 2px 3px">${flag(m.l)} ${esc(title(m.l))} · започна ${fmtDate(m.k)} ${fmtTime(m.k)}</div>` + matchCard(m)).join("")}</div></details>`;
}

function renderResults() {
  const since = new Date(Date.now() - (+rs.period) * 864e5).toISOString();
  let rows = REC.filter(r => r.k >= since);
  if (rs.filter === "tip") rows = rows.filter(r => r.t);
  if (rs.filter === "break") rows = rows.filter(r => (r.f || []).includes("after_break"));
  if (rs.filter === "derby") rows = rows.filter(r => (r.f || []).includes("derby"));
  const el = document.getElementById("rs-body");
  let html = "";
  if (!REC.length) {
    html += `<div class="note">Записът на живо ${DATA.first_tip ? "започна на " + fmtDate(DATA.first_tip) : "започва с първите мачове"}.
      Тук ще се трупа всяка прогноза, записана преди мача, и дали е излязла - по лиги и по пазари.
      Докато се натрупа, в таба <b>Лиги</b> е проверката назад във времето (симулация на същия робот за 2023-2026).</div>`;
  }
  html += pendingBox();
  const keepOpen = () => { const pd = document.getElementById("rs-pend");
    if (pd) { pd.open = !!rs.pendOpen; pd.ontoggle = () => { rs.pendOpen = pd.open; }; } };
  if (!rows.length) {
    el.innerHTML = html + (REC.length ? `<div class="empty">Няма уредени мачове за този период.</div>` : "");
    keepOpen();
    return;
  }
  const mo = money(rows.filter(r => OLD_RULES.includes(r.rl)));
  const tipRows = rows.filter(r => r.t && OLD_RULES.includes(r.rl));
  const th = tipRows.filter(r => hit(r.t, r.s)).length;
  const predTile = (key, name) => {
    const xs = rows.filter(r => r[key]).map(r => ({h: hitAny(r[key][0], r.s, r.ct, r.cs), o: r[key][2], s: r[key][0]})).filter(x => x.h != null);
    if (!xs.length) return "";
    const h = xs.filter(x => x.h).length, pr = xs.filter(x => x.o).map(x => x.h ? x.o - 1 : -1);
    const sum = pr.reduce((a, b) => a + b, 0) * STAKE;
    const x = key === "rk" ? xs.filter(v => v.s === "X") : [];
    return `<div class="tile"><div class="k">${name}</div><div class="v">${pct(h / xs.length)}</div>
      <div class="s">${h} от ${xs.length} · ± ${pct(Math.sqrt(h / xs.length * (1 - h / xs.length) / xs.length))}${x.length ? ` · X: ${x.filter(v => v.h).length} от ${x.length}` : ""}${pr.length ? `<br>при ${STAKE} € (където има коефициент): <b class="${sum >= 0 ? "pos" : "neg"}">${eur(sum)}</b> на ${pr.length}` : ""}</div></div>`;
  };
  const oneTile = (() => {
    const xs = rows.filter(r => r.one).map(r => ({h: hitAny(r.one[0], r.s, r.ct, r.cs), p: r.one[1], o: r.one[2], b: r.one[3] === "book"})).filter(x => x.h != null);
    if (!xs.length) return "";
    const h = xs.filter(x => x.h).length, n = xs.length, said = xs.reduce((a, x) => a + x.p, 0) / n;
    const pr = xs.filter(x => x.b).map(x => x.h ? x.o - 1 : -1), sum = pr.reduce((a, b) => a + b, 0) * STAKE;
    return `<div class="tile" style="border:2px solid var(--home)"><div class="k">Прогнозата на робота (една за мач)</div><div class="v">${pct(h / n)}</div>
      <div class="s">${h} от ${n} · ± ${pct(Math.sqrt(h / n * (1 - h / n) / n))} · роботът казваше средно ${pct(said)}${ONEBT && ONEBT.clean ? `<br>назад: ${pct(ONEBT.clean.hit)} на ${ONEBT.clean.n}` : ""}${pr.length ? `<br>при ${STAKE} € (където има коефициент от букмейкър): <b class="${sum >= 0 ? "pos" : "neg"}">${eur(sum)}</b> на ${pr.length}` : ""}</div></div>`;
  })();
  html += `<div class="tiles">
    ${oneTile}${predTile("rk", "Рискова прогноза")}${predTile("sf", "По-сигурна прогноза")}
    ${tipRows.length ? `<div class="tile"><div class="k">Съвети по старите правила</div><div class="v">${pct(th / tipRows.length)}</div>
      <div class="s">${th} от ${tipRows.length}${mo ? ` · ${eur(mo.sum)} при ${STAKE} €` : ""} (до 30.09)</div></div>` : ""}
    ${["cards", "corners"].map(k => { const xs = rows.filter(r => r.x && r.x[k] && r.x[k][2] != null);
      if (!xs.length) return ""; const h = xs.filter(r => r.x[k][0] === "O" ? r.x[k][2] > r.x[k][1] : r.x[k][2] < r.x[k][1]).length;
      return `<div class="tile"><div class="k">${XK[k]} - роботът</div><div class="v">${pct(h / xs.length)}</div><div class="s">${h} от ${xs.length} (над/под по очаквания брой; умение още не е доказано)</div></div>`; }).join("")}
    ${["1x2", "dc", "ou"].map(k => { const a = hits(rows, "robot", k), b = hits(rows, "market", k);
      return a ? `<div class="tile"><div class="k">${MKT[k]} - роботът</div><div class="v">${pct(a.p)}</div>
        <div class="s">${a.h} от ${a.n}${b ? ` · пазарът ${pct(b.p)}` : ""}</div></div>` : ""; }).join("")}
  </div>`;
  const np = rows.filter(r => r.rk).length;
  if (np && np < 200) html += `<div class="note small">Малка извадка (${np} мача с прогноза): процентите се лутат с няколко пункта само от случайността. Не прави изводи преди поне няколкостотин. Назад във времето (2023-2026): рисковата познава ${SB.risky && SB.risky.clean ? pct(SB.risky.clean.hit) : "–"}, по-сигурната ${SB.safer && SB.safer.clean ? pct(SB.safer.clean.hit) : "–"}.</div>`;
  // по лиги
  const per = {};
  rows.forEach(r => (per[r.l] = per[r.l] || []).push(r));
  const lrows = Object.entries(per).map(([c, xs]) => {
    const a = hits(xs, "robot", "1x2"), d = hits(xs, "robot", "dc"), o = hits(xs, "robot", "ou");
    const rate = key => { const v = xs.filter(r => r[key]).map(r => hitAny(r[key][0], r.s, r.ct, r.cs)).filter(h => h != null);
      return v.length ? [v.filter(Boolean).length / v.length, v.length] : [null, 0]; };
    const [rk, rkn] = rate("rk"), [sf, sfn] = rate("sf"), [one, onen] = rate("one");
    return {c, n: xs.length, one, onen, rk, rkn, sf, sfn, x12: a ? a.p : null, dc: d ? d.p : null, ou: o ? o.p : null};
  }).sort((a, b) => rs.sortDir * ((a[rs.sortKey] ?? -9) - (b[rs.sortKey] ?? -9)));
  html += `<h2>По първенства</h2><div class="tbl-wrap"><table id="rs-tbl"><thead><tr>
    <th>Първенство</th><th data-sort="n">Мачове</th><th data-sort="one">Прогнозата</th><th data-sort="rk">Рискова</th><th data-sort="sf">По-сигурна</th><th data-sort="x12">1/X/2</th>
    <th data-sort="dc">Дв. шанс</th><th data-sort="ou">Над/под 2.5</th></tr></thead><tbody>
    ${lrows.map(x => `<tr><td class="l">${flag(x.c)} ${esc(title(x.c))}</td><td class="num">${x.n}</td>
      <td class="num">${x.one == null ? "–" : pct(x.one) + ` <span class="muted">(${x.onen})</span>`}${ONEBT && ONEBT.leagues[x.c] ? ` <span class="muted small">назад ${pct(ONEBT.leagues[x.c].hit)}</span>` : ""}</td>
      <td class="num">${x.rk == null ? "–" : pct(x.rk) + ` <span class="muted">(${x.rkn})</span>`}</td>
      <td class="num">${x.sf == null ? "–" : pct(x.sf) + ` <span class="muted">(${x.sfn})</span>`}</td>
      <td class="num">${pct(x.x12)}</td><td class="num">${pct(x.dc)}</td><td class="num">${pct(x.ou)}</td></tr>`).join("")}</tbody></table></div>`;
  // мач по мач
  html += `<h2>Мач по мач</h2><div class="tbl-wrap" id="rs-list"></div><button class="more" id="rs-more" type="button">Покажи още</button>`;
  el.innerHTML = html;
  keepOpen();
  el.querySelectorAll("#rs-tbl th[data-sort]").forEach(th => th.onclick = () => {
    const k = th.dataset.sort; rs.sortDir = rs.sortKey === k ? -rs.sortDir : -1; rs.sortKey = k; renderResults(); });
  const list = document.getElementById("rs-list"), more = document.getElementById("rs-more");
  const draw = () => {
    let last = "", out = "";
    rows.slice(0, rs.shown).forEach(r => {
      const d = fmtDate(r.k);
      if (d !== last) { out += `<div class="day-h" style="padding:0 12px">${d}</div>`; last = d; }
      out += resultRow(r);
    });
    list.innerHTML = out;
    more.hidden = rows.length <= rs.shown;
  };
  more.onclick = () => { rs.shown += 60; draw(); };
  draw();
}

function leagueRow(c) {

          cards: g && g.cards != null ? g.cards : null, corners: g && g.corners != null ? g.corners : null,
          toto: t ? t.diff : null, totoT: t ? t.t : null, totoOk: a.toto && a.toto.confirmed,
          rk: sl.risky ? sl.risky.hit : null, rkN: sl.risky ? sl.risky.n : 0, sf: sl.safer ? sl.safer.hit : null,
          xh: sl.x ? sl.x.hit : null, xn: sl.x ? sl.x.n : 0,
          r1: r1 ? r1.hit : null, m1: m1 ? m1.hit : null,
          one: ob ? ob.hit : null, oneN: ob ? ob.n : 0,
          live: lt.length ? lt.filter(Boolean).length / lt.length : null, liveN: lt.length};
}

    <p class="small muted" style="margin:0 0 8px">Професионалистът: най-много в Холандия и Германия (1., 2. и 3. Бундеслига), най-малко в Египет, Испания и Италия. Египет го няма в безплатните данни.</p>

  <div class="tbl-wrap"><table id="lg-tbl"><thead><tr><th>Първенство</th>

        <td class="num">${r.goals.toFixed(2)}</td><td class="num">${pct(r.home_win)}</td></tr>`).join("")}

  }
  const d = a.derbies || {};
  if (d.n) h += `<p class="small"><b>Дербита:</b> ${d.n}${d.calib ? `, равни ${pct(d.calib.draw_actual)} при обещани ${pct(d.calib.draw_expected)}` : ""}.</p>`;
  if (a.odds === "closing") h += `<p class="small muted">В тази лига историята има само затварящи коефициенти (по-точни от тези преди мача) - доходът назад е по-строг от реалния.</p>`;
  if (a.odds === "none") h += `<p class="small muted">В тази лига историята е без коефициенти - доход назад не може да се смята.</p>`;
  return h + `</div>`;
}

// ======================= ПРОФЕСИОНАЛИСТ =======================
function renderPro() {
  const tips = DATA.pro || [];
  const el = document.getElementById("pr-body");
  el.innerHTML = `<p class="lede" style="margin-top:0">Целият сайт е построен по неговите идеи. Тук е всеки съвет, който е дал: какво казва, какво показват данните и какво прави роботът с него. Новите му указания (и гласовите съобщения) се добавят тук.</p>` +
    (tips.length ? tips.map((t, i) => `<div class="pro-tip"><span class="pro-date">${i + 1}. ${esc(t.date || "")}</span>
      ${t.title ? `<h3 class="pro-h">${esc(t.title)}</h3>` : ""}
      <p class="pro-said"><b>Той казва:</b> ${esc(t.text)}</p>
      ${t.check ? `<p class="pro-check"><b>Проверка на данни:</b> ${esc(t.check)}</p>` : ""}
      ${t.status ? `<p class="pro-status">${esc(t.status)}</p>` : ""}</div>`).join("") : `<div class="empty">Още няма съвети.</div>`);
}

// ---------- старт ----------
initForecasts();
fetchBonus();
setInterval(fetchResults, 60e3);
initResults();
fetchResults();
initLeagues();
renderPro();
const start = (location.hash || "").slice(1) || store("tab");
if (start && document.getElementById(start) && tabs.some(t => t.id === start)) selectTab(start);
</script>
